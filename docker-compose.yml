# Deploy VPS Ubuntu, dùng chung VPS với các soosky-*-api khác.
#
# Đúng MỘT container. Không có MongoDB ở đây: MONGO_URI trong .env trỏ tới Atlas.
#
# QUAN TRỌNG: 1 container = 1 sync scheduler. DailyScheduler chạy trong process Node,
# nên thêm replica là gọi FTC API nhiều lần cùng lúc. Không scale service này.

services:
    api:
        build:
            context: .
        image: soosky-bot-spam-call:latest
        container_name: soosky-bot-spam-call
        restart: unless-stopped
        # PID 1 reaper, để SIGTERM tới được app và zombie được thu dọn.
        init: true

        ports:
            # Cổng trên VPS: 3000 soosky-plant-care-api, 3001 soosky-storm-api,
            # 3002 soosky-weather-marine-api -> service này dùng 3003.
            # Kiểm tra trước: sudo ss -ltnp | grep :3003
            # Cổng 3000 bên trong container không bao giờ xung đột.
            # Bind loopback: chỉ nginx vào được, không lộ ra Internet.
            - "127.0.0.1:${HOST_PORT:-3003}:3000"

        # Phải lớn hơn 15 giây, không thì
        # Docker SIGKILL giữa lúc app đang drain HTTP + chờ sync chạy xong.
        stop_grace_period: 30s

        env_file:
            - .env

        environment:
            # Cố định bên trong container, độc lập với HOST_PORT ở trên.
            HTTP_HOST: "0.0.0.0"
            HTTP_PORT: "3000"
            # Trần V8 heap, để V8 gom rác trước khi kernel OOM-kill.
            NODE_OPTIONS: "--max-old-space-size=${NODE_MAX_OLD_SPACE_MB:-256}"

        healthcheck:
            # /health trả 503 NEVER_SYNCED tới khi lần sync FTC đầu tiên xong,
            # nên start_period phải đủ dài cho lần sync lúc boot.
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            interval: 30s
            timeout: 5s
            start_period: 180s
            retries: 3

        # App không cache dữ liệu trong RAM (chỉ map rate limit, tối đa vài MB) nên
        # nhẹ hơn soosky-storm-api. Node baseline ~80MB + Mongo pool 5.
        mem_limit: ${MEM_LIMIT:-300m}
        memswap_limit: ${MEM_LIMIT:-300m}

        security_opt:
            - "no-new-privileges:true"
        cap_drop:
            - ALL

        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
