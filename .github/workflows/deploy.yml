name: Deploy to VPS

# Chạy khi push lên nhánh chính. Đổi 'master' nếu repo dùng 'main'.
on:
  push:
    branches: [master, main]
  workflow_dispatch: {}   # cho phép bấm chạy tay trong tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH vào VPS, pull code, build & chạy docker
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}        # thường 22
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}      # vd /home/ubuntu/soosky-bot-spam-call
            git pull origin ${{ github.ref_name }}
            docker compose up -d --build
            docker image prune -f               # dọn image cũ, khỏi đầy đĩa
