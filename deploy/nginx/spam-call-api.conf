# Soosky Bot Spam Call — nginx reverse proxy
#
#   sudo cp deploy/nginx/spam-call-api.conf /etc/nginx/sites-available/spam-call-api
#   sudo ln -s /etc/nginx/sites-available/spam-call-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d project4.vuonghieu.site
#
# certbot sẽ tự thêm block listen 443 + chứng chỉ vào file này.

server {
    listen 80;
    listen [::]:80;
    server_name project4.vuonghieu.site;

    access_log /var/log/nginx/spam-call-api.access.log;
    error_log  /var/log/nginx/spam-call-api.error.log;

    # API chỉ có GET, không cần nhận body lớn.
    client_max_body_size 64k;

    gzip            on;
    gzip_types      application/json;
    gzip_min_length 512;

    location / {
        proxy_pass http://127.0.0.1:3003;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # App có HTTP_TRUST_PROXY=1 nên rate limit đọc IP client từ header này.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Trả 429/503 của app nguyên trạng cho client thay vì trang lỗi nginx.
        proxy_intercept_errors off;
    }
}
